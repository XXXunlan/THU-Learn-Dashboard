<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>面板预览（mock 数据）</title>
    <link rel="stylesheet" href="../../src/dashboard/dashboard.css" />
    <script src="mock-chrome.js"></script>
  </head>
  <body>
    <p style="margin:0;padding:6px 12px;background:#fff5e5;color:#6b4300;font:12px sans-serif">
      预览页：使用 mock 数据渲染真实面板（不是扩展运行环境）
    </p>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">THU</span>
        <div class="brand-text">
          <strong>网络学堂面板</strong>
          <span id="brand-sub">课程 · 公告 · 文件 · 作业</span>
        </div>
      </div>
      <div class="topbar-center">
        <input id="search" class="search" type="search" placeholder="搜索课程 / 公告 / 文件 / 作业…" autocomplete="off" />
      </div>
      <div class="topbar-right">
        <span id="status-chip" class="chip chip-idle">未连接</span>
        <button id="btn-refresh" class="btn btn-primary" title="重新抓取全部课程">刷新</button>
        <button id="btn-settings" class="btn btn-icon" title="设置">⚙</button>
      </div>
    </header>

    <div id="progress-bar" class="progress hidden"><div class="progress-fill"></div><span class="progress-text"></span></div>
    <div id="banner" class="banner hidden">
      <div class="banner-text" id="banner-text"></div>
      <div class="banner-actions" id="banner-actions"></div>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-head"><span>课程</span><span id="course-count" class="muted">0</span></div>
        <nav id="course-list" class="course-list"></nav>
        <div class="sidebar-foot">
          <div id="last-updated" class="muted">尚未抓取</div>
          <div class="sidebar-foot-actions">
            <button id="btn-export" class="link">导出诊断</button>
            <button id="btn-logout" class="link">退出登录</button>
          </div>
        </div>
      </aside>
      <main class="main">
        <section class="course-hero" id="course-hero"></section>
        <div class="tabs" id="tabs">
          <button class="tab is-active" data-tab="homework">作业 <span class="count" id="tab-count-homework">0</span></button>
          <button class="tab" data-tab="notice">公告 <span class="count" id="tab-count-notice">0</span></button>
          <button class="tab" data-tab="file">文件 <span class="count" id="tab-count-file">0</span></button>
          <button class="tab" data-tab="all">全部</button>
          <div class="tabs-spacer"></div>
          <div class="tabs-tools" id="tabs-tools"></div>
        </div>
        <section id="panel" class="panel"></section>
      </main>
    </div>

    <div id="drawer" class="drawer hidden">
      <div class="drawer-mask" data-close="1"></div>
      <div class="drawer-body">
        <div class="drawer-head"><strong>设置</strong><button class="btn btn-icon" data-close="1">✕</button></div>
        <div class="drawer-content">
          <label class="field"><span>自动刷新间隔（分钟，0 关闭）</span><input id="set-autoRefresh" type="number" /></label>
          <label class="switch"><input id="set-showCompleted" type="checkbox" /><span>显示已完成的作业</span></label>
          <label class="switch"><input id="set-yuketangHomework" type="checkbox" /><span>抓雨课堂作业</span></label>
          <label class="switch"><input id="set-deepScan" type="checkbox" /><span>深扫作业详情</span></label>
          <label class="switch"><input id="set-hideEmpty" type="checkbox" /><span>隐藏没有内容的课程</span></label>
          <label class="switch"><input id="set-floating" type="checkbox" /><span>悬浮入口</span></label>
          <label class="switch"><input id="set-tabFallback" type="checkbox" /><span>渲染兜底</span></label>
          <label class="switch"><input id="set-autoLogin" type="checkbox" /><span>自动填充</span></label>
          <label class="field"><span>每门课最多条目</span><input id="set-maxItems" type="number" /></label>
          <label class="field"><span>并发数</span><input id="set-concurrency" type="number" /></label>
          <div class="drawer-note" id="settings-note"></div>
          <div class="drawer-section"><button id="btn-forget" class="btn">清除凭据</button><button id="btn-open-learn" class="btn">打开网络学堂</button></div>
          <!-- 调试入口：默认隐藏，由下面的开关控制（与真实面板同一套 .debug-only 机制） -->
          <div class="debug-only hidden" id="debug-panel">
            <div class="drawer-section"><button id="btn-export2" class="btn">导出诊断</button></div>
          </div>
          <div class="drawer-section">
            <label class="switch"><input id="set-debugMode" type="checkbox" /><span>显示调试与取证功能</span></label>
          </div>
        </div>
      </div>
    </div>

    <div id="login-modal" class="modal hidden">
      <div class="modal-mask"></div>
      <div class="modal-body">
        <h2>登录网络学堂</h2>
        <p class="muted" id="login-hint"></p>
        <label class="field"><span>学号 / 账号</span><input id="login-user" type="text" /></label>
        <label class="field"><span>密码</span><input id="login-pass" type="password" /></label>
        <label class="switch"><input id="login-remember" type="checkbox" /><span>记住密码</span></label>
        <div id="login-error" class="login-error hidden"></div>
        <div class="modal-actions">
          <button id="login-submit" class="btn btn-primary">保存并打开登录页</button>
          <button id="login-manual" class="btn">我已在浏览器里登录</button>
          <button id="login-cancel" class="btn btn-ghost">取消</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script type="module" src="../../src/dashboard/dashboard.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>清华大学统一身份认证</title>
</head>
<body class="iaaa-login">
<!--
  统一身份认证（id.tsinghua.edu.cn）的登录页：跨域、带图形验证码。
  解析器这里必须做到两件事：认得出 captcha 字段（hasCaptcha）以及算出 crossOrigin，
  好让面板提示用户“需要手动登录 / 需要跨域权限”，而不是傻乎乎地 POST 一个不存在的接口。
-->
  <div class="login-wrap">
    <h2>统一身份认证</h2>
    <form id="loginForm" action="https://id.tsinghua.edu.cn/do/off/ui/auth/login/for/learn" method="post">
      <input type="hidden" name="execution" value="e1s1">
      <input type="hidden" name="_eventId" value="submit">
      <div class="form-row">
        <input type="text" id="username" name="username" placeholder="学号 / 用户名" autocomplete="username">
      </div>
      <div class="form-row">
        <input type="password" id="password" name="password" autocomplete="current-password">
      </div>
      <div class="form-row captcha-row">
        <input type="text" id="captcha" name="captcha" placeholder="验证码" maxlength="4">
        <img src="/captcha.jpg" alt="验证码图片">
      </div>
      <div class="form-row">
        <input type="submit" name="submit" value="登录">
      </div>
    </form>
  </div>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>网络学堂 × 雨课堂</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="brand"><span class="mark">THU</span><strong>网络学堂 × 雨课堂</strong></div>
      <span id="chip" class="chip chip-idle">未连接</span>
    </header>

    <div id="progress" class="progress hidden"><div class="progress-fill"></div></div>

    <!-- 已登录视图 -->
    <section id="view-main" class="body hidden">
      <div class="stats">
        <div class="stat" id="stat-pending"><b>0</b><span>待交作业</span></div>
        <div class="stat" id="stat-day"><b>0</b><span>24h 内</span></div>
        <div class="stat" id="stat-notice"><b>0</b><span>公告</span></div>
        <div class="stat" id="stat-file"><b>0</b><span>文件</span></div>
      </div>

      <div class="section-title">最近截止<span id="meta" class="muted"></span></div>
      <div id="upcoming" class="list"></div>

      <div class="actions">
        <button id="btn-dashboard" class="btn btn-primary">打开汇总面板</button>
        <button id="btn-refresh" class="btn">刷新</button>
      </div>
    </section>

    <!-- 未登录视图 -->
    <section id="view-login" class="body hidden">
      <p class="hint" id="login-hint">网络学堂使用学校统一身份认证登录。填写账号密码后点「保存并打开登录页」，扩展会自动填充，你只需完成验证码/二次认证。</p>
      <label class="field"><span>学号 / 账号</span><input id="user" type="text" autocomplete="username" /></label>
      <label class="field"><span>密码</span><input id="pass" type="password" autocomplete="current-password" /></label>
      <label class="switch"><input id="remember" type="checkbox" /><span>记住密码（明文存本机）</span></label>
      <div id="err" class="err hidden"></div>
      <div class="actions">
        <button id="btn-login" class="btn btn-primary">保存并打开登录页</button>
        <button id="btn-manual" class="btn">我已在浏览器登录</button>
      </div>
    </section>

    <footer class="foot">
      <button id="link-open" class="link">网络学堂</button>
      <button id="link-logout" class="link hidden">退出登录</button>
      <button id="link-settings" class="link">设置</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
